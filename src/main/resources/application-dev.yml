spring:
  datasource:
    url: jdbc:h2:mem:library_management;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  seed-sample-data: true

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.web: INFO
