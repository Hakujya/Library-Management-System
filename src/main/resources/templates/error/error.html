<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${errorTitle != null ? errorTitle : 'System Notice'})}"></head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width: 580px; width: 100%;">
        <div class="mb-3">
            <span class="display-3 fw-bold text-primary" th:text="${errorCode != null ? errorCode : 500}">404</span>
        </div>
        <h3 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Unable to Complete Request'}">Notice</h3>
        <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested item could not be retrieved or the operation could not be completed.'}">
            Something unexpected occurred.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
            <a th:href="@{/books}" class="btn btn-outline-secondary px-3">
                <i class="bi bi-journal-bookmark me-1"></i> Browse Catalog
            </a>
            <a th:href="@{/loans}" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-left-right me-1"></i> Circulation Loans
            </a>
        </div>
    </div>
</div>

<!-- Footer & Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
